// =============================================================================
// Example map group: Ep4 towns and their interiors
// =============================================================================
// A worked example, not something referenced by .env yet. It exists so the
// mechanism is testable before Phase 7 and so the format is unambiguous.
//
// Lines are `map: <name>`. Anything else is ignored. Everything NOT listed here
// gets a `delmap:` generated for it at container start.
//
// This is the town half of an Ep4 split. Pair it with a `fields.conf` and a
// `dungeons.conf` covering the rest — every map must land in exactly one group.
// Verify with: ./tools/check-map-groups.sh towns fields dungeons

// ---- Prontera ----
// The single heaviest map on any RO server. When you split, this is what you
// split off first.
map: prontera
map: prt_in
map: prt_castle
map: prt_church
map: prt_are_in
map: prt_are01

// ---- Geffen ----
map: geffen
map: geffen_in
map: gef_tower

// ---- Payon ----
map: payon
map: payon_in01
map: payon_in02
map: payon_in03

// ---- Morroc ----
map: morocc
map: morocc_in
map: moc_castle

// ---- Alberta ----
map: alberta
map: alberta_in

// ---- Izlude ----
map: izlude
map: izlude_in

// ---- Al De Baran ----
map: aldebaran
map: aldeba_in

// ---- Lutie (Ep3) ----
map: xmas
map: xmas_in

// ---- Comodo (Ep4) ----
map: comodo
map: cmd_in01
map: cmd_in02

// ---- Starting maps (pre-renewal novice grounds) ----
map: new_1-1
map: new_2-1
map: new_3-1
map: new_4-1
map: new_5-1
map: new_1-2
map: new_2-2
map: new_3-2
map: new_4-2
map: new_5-2
map: new_1-3
map: new_2-3
map: new_3-3
map: new_4-3
map: new_5-3
