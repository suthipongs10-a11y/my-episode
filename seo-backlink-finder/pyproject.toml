[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-backlink-finder"
version = "0.1.0"
description = "Find, classify, and quality-rank backlink opportunities, and draft on-topic outreach in the target site's language."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "my-episode" }]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "tldextract>=3.4",
    "rich>=13.0",
]

[project.optional-dependencies]
# Everything below is optional. The tool degrades gracefully without it.
dev = ["pytest>=7.0"]

[project.scripts]
blf = "blf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blf*"]

[tool.setuptools.package-data]
blf = ["data/*.yaml", "data/*.json"]
