name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run; rAthena compiles are too slow to
# queue up behind each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never sees a real secret. These exist only so Compose can interpolate
  # and the containers can start; nothing here reaches a deployed host.
  CI_DUMMY_ENV: "1"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml

      - name: ShellCheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'checking %d scripts\n' "${#scripts[@]}"
          shellcheck --severity=warning --external-sources "${scripts[@]}"

      - name: yamllint
        run: yamllint --strict .

      - name: ShellCheck the bash embedded in workflows
        # The heredocs in deploy.yml and ops.yml run on the VPS. A syntax error
        # there is not a build failure — it is a half-finished deploy on a
        # machine nobody is watching.
        run: ./tools/check-workflow-scripts.sh

      - name: The deploy workflow's .env logic behaves
        # Exercises the real step, extracted from deploy.yml: creates .env,
        # generates passwords, is idempotent across redeploys, follows a host
        # move, and fails loudly when an input is missing.
        run: ./tools/test-deploy-env.sh

      - name: Python syntax
        run: |
          mapfile -t scripts < <(git ls-files '*.py')
          printf 'checking %d scripts\n' "${#scripts[@]}"
          python3 -m py_compile "${scripts[@]}"

      - name: The protocol smoke client speaks the right dialect
        # smoke-play.py's packet ids and field offsets are hand-derived from
        # rAthena source for our packetver. A wrong offset does not throw — it
        # reads a plausible number from the wrong place and reports success.
        # This runs it against mock servers that pin the byte layout.
        run: ./tools/test-smoke-play.py

      - name: The client recon tooling reads the formats it claims to
        # grflib.py parses GRF file tables and client-survey.py parses PE
        # images. Both are meant to be run once, on a Windows box, against a
        # folder that exists nowhere else — so a bug in either costs a round
        # trip through a human before anyone finds out. Both formats are fully
        # specified, so this builds a real archive and a real executable here
        # and checks what the tools report about them.
        run: ./tools/test-client-survey.py

      - name: Every vox scene has a background, not a flat fill
        # brand.md §4a, locked 2026-08-18. vox-11 needed three full renders to reach it
        # because nobody counted the empty scenes first; this is that count, in CI.
        # Shots older than the rule are listed by name inside the script, not skipped silently.
        working-directory: shorts-factory/remotion
        run: node scripts/check-scene-imagery.mjs --check

      - name: Thai captions are generated, not typed
        # shorts-factory/tools/gen_srt.py turns each video's measured line timings into an
        # SRT. Its own --check needs the wav files, which are gitignored, so what CI can
        # guard is the layout logic and the committed .srt files — driven over all 229 real
        # script lines, because an earlier synthetic fixture passed against every bug it was
        # written to catch.
        working-directory: shorts-factory
        run: ./tools/test-gen-srt.py

      - name: Hadolint
        # Mounted rather than piped on stdin: .hadolint.yaml lives in the
        # workspace, and a container reading the Dockerfile from stdin cannot
        # see it — the config would be silently ignored.
        run: |
          for df in $(git ls-files '*Dockerfile'); do
            echo "== ${df}"
            docker run --rm -v "${PWD}:/repo:ro" -w /repo \
              hadolint/hadolint:latest-alpine \
              hadolint --config .hadolint.yaml "${df}"
          done

      - name: Base images are pinned by digest
        # CLAUDE.md Phase 0. A floating tag means a rebuild six months from now
        # is a different build, and we would not know which change broke it.
        run: |
          unpinned=$(git ls-files '*Dockerfile' | xargs grep -hE '^FROM ' | grep -v '@sha256:' || true)
          if [ -n "${unpinned}" ]; then
            echo "FROM lines without a digest:"
            echo "${unpinned}"
            exit 1
          fi
          echo "all base images pinned"

      - name: No hardcoded addresses or credentials
        # CLAUDE.md §2.1 — the single most important rule in that file.
        # Templates and compose read from the environment; a literal IP in a
        # tracked file means moving VPS becomes a code change.
        run: bash tools/check-no-hardcoded-config.sh

  proxy:
    name: Proxy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
        working-directory: proxy
      - run: npm run check
        working-directory: proxy

  client:
    name: PC client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Selftests
        run: |
          node client/build-client.mjs --selftest
          node tools/check-client-imports.mjs --selftest

      - name: Stage and configure a client
        env:
          # A hostname that can never resolve, so a mistake here cannot reach
          # anybody's server. The build only writes it into a config file.
          RO_SERVER_ADDRESS: play.example.invalid
          RO_CLIENT_GRF_LIST: /nonexistent/data.grf
          # We need node_modules for the import map and the rijndael shim, not
          # a runnable Electron. Skips a ~100 MB download per run.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: node client/build-client.mjs --stage-only

      - name: Every module specifier resolves
        # The failure this guards against is silent: one unresolvable static
        # import fails roBrowser's whole module graph at load, and the player
        # sees a black window with no message. Upstream ships two of them —
        # docs/phase-3-robrowser.md has the trace. This is the check that stops
        # a submodule bump from quietly bringing them back.
        run: node tools/check-client-imports.mjs

      - name: The client and the server agree on the wire
        # Official clients shuffle their packet ids every release. rAthena and
        # roBrowser each carry their own table of that, and they only agree on a
        # date both of them have. Disagreement produces no error at all — the
        # server parses the id as whatever else it means and the client waits
        # forever. This preprocesses rAthena's real headers at the configured
        # PACKETVER and compares, so a change to that number cannot silently
        # break the PC client again.
        run: node tools/check-client-protocol.mjs

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for the map-group and entrypoint checks below, which read
          # rAthena's own map list.
          submodules: recursive

      - name: Synthesise a .env
        run: |
          cp .env.example .env
          ./tools/gen-secrets.sh
          sed -i 's|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.invalid|' .env
          # Anything still unset would fail interpolation; catch it here.
          # Anchored: the file's header mentions CHANGE_ME in a comment.
          if grep -qE '^[A-Za-z_][A-Za-z0-9_]*=CHANGE_ME' .env; then
            echo "unresolved placeholders in .env:"
            grep -nE '^[A-Za-z_][A-Za-z0-9_]*=CHANGE_ME' .env
            exit 1
          fi

      - name: .env.example and the checker agree
        # Guards the upgrade path: a key added to .env.example must be
        # something check-env.sh can detect and append on a deployed host.
        run: ./tools/check-env.sh

      - name: Validate the default stack
        run: ./tools/compose.sh config --quiet

      - name: Validate with every profile enabled
        # The scale-out topology must stay valid even while it is dormant,
        # otherwise "N>1 by config alone" is not true (CLAUDE.md §3).
        run: |
          sed -i 's|^COMPOSE_PROFILES=.*|COMPOSE_PROFILES=web,backup,map2,map3|' .env
          ./tools/compose.sh config --quiet
          services=$(./tools/compose.sh config --services | sort | tr '\n' ' ')
          echo "services: ${services}"
          for expected in db login char map1 map2 map3 web proxy caddy backup; do
            case " ${services} " in
              *" ${expected} "*) ;;
              *) echo "missing service: ${expected}"; exit 1 ;;
            esac
          done

      - name: Map group files are valid
        run: ./tools/check-map-groups.sh

      - name: Entrypoint renders configuration correctly
        # The riskiest logic in Phase 0: a bad render produces a server that
        # starts and then misbehaves, which no build check would catch.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext-base
          ./tools/test-entrypoint.sh

  build:
    name: Build images
    runs-on: ubuntu-latest
    # rAthena is a long compile and this is the Phase 0 gate: a clean clone
    # must build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Synthesise a .env
        run: |
          cp .env.example .env
          ./tools/gen-secrets.sh
          sed -i 's|^ACME_EMAIL=.*|ACME_EMAIL=ci@example.invalid|' .env

      - name: Build
        # --progress is a top-level compose flag, not a build flag, so it goes
        # before the subcommand.
        run: ./tools/compose.sh --progress plain build

      - name: The rAthena binaries exist and are a pre-renewal build
        run: |
          image=$(./tools/compose.sh config --format json \
            | jq -r '.services.map1.image')
          echo "image: ${image}"
          for binary in login-server char-server map-server web-server; do
            docker run --rm --entrypoint sh "${image}" \
              -c "test -x /opt/rathena/${binary}" \
              && echo "  ok ${binary}"
          done

          # `--version` does not report renewal mode, so check the binary
          # itself. RENEWAL is a compile-time #ifdef around which script tree
          # gets loaded, so exactly one of these strings is present.
          # Getting this wrong is not a build error — it is a server that
          # quietly runs renewal mechanics.
          docker run --rm --entrypoint sh "${image}" -c '
            set -e
            if ! grep -aq "npc/pre-re/scripts_main.conf" /opt/rathena/map-server; then
              echo "map-server has no pre-renewal script path — not a PRERE build"
              exit 1
            fi
            if grep -aq "npc/re/scripts_main.conf" /opt/rathena/map-server; then
              echo "map-server contains the renewal script path — RENEWAL is defined"
              exit 1
            fi
            echo "  ok pre-renewal build confirmed"
          '

      - name: The entrypoint refuses to start without configuration
        run: |
          image=$(./tools/compose.sh config --format json | jq -r '.services.map1.image')

          # Capture the status directly. `docker run ... | tee` reports tee's
          # exit status, not docker's, so piping here would assert nothing and
          # the check would fail against a container that behaved correctly.
          set +e
          out=$(docker run --rm "${image}" map 2>&1)
          rc=$?
          set -e

          printf '%s\n' "${out}"
          if [ "${rc}" -eq 0 ]; then
            echo "expected a non-zero exit with no environment set, got 0"
            exit 1
          fi
          printf '%s\n' "${out}" | grep -q 'missing required environment variables'
          echo "ok — exits ${rc} and says which variables are missing"
